name: STAX smoke test

# Paths are duplicated across the two triggers rather than shared, because
# GitHub Actions has no anchor or alias support in workflow `on:` blocks — a
# YAML anchor here is accepted by the parser and then silently ignored.
#
# `push` is not decoration. This workflow existed for months triggering only on
# pull_request, while roughly fifteen commits of agent-sidecar work went
# straight to main: the MCP server, vps_exec, the sandbox move, the audit
# ownership fix. None of it was ever tested by CI. The tests passed on the VPS,
# by hand, which is exactly the kind of evidence docs/king-mistakes.md entry 2
# says not to trust. A workflow named "STAX smoke test" that covers precisely
# the files being changed, and does not run when they change, is a guard that
# does not cover the case it appears to cover.
on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "agent-sidecar/**"
      - "activepieces/**"
      - "observability/**"
      - "caddy/**"
      - "codegraph/**"
      - "scripts/**"
      - ".github/workflows/stax-smoke.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "agent-sidecar/**"
      - "activepieces/**"
      - "observability/**"
      - "caddy/**"
      - "codegraph/**"
      - "scripts/**"
      - ".github/workflows/stax-smoke.yml"
  workflow_dispatch: {}

jobs:
  # Fast, Docker-free gate. The preflight script is what stands between an
  # operator and deploying with placeholder secrets or wide-open ports, so its
  # own logic is tested rather than assumed — and a broken script is caught in
  # seconds instead of after a 9-minute image build.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Self-test the preflight checks
        run: ./scripts/stax-preflight.sh --self-test

      - name: Placeholder secret must be rejected
        run: |
          set -euo pipefail
          # The value below is the literal fallback in docker-compose.yml.
          # If preflight ever stops catching it, this job fails loudly.
          if OH_AGENT_CANVAS_SECRET_KEY='CHANGEME-openssl-rand-base64-32' \
               ./scripts/stax-preflight.sh openhands; then
            echo "preflight accepted the placeholder secret — it must not" >&2
            exit 1
          fi
          echo "Placeholder correctly rejected."

      - name: A real secret must be accepted
        run: |
          set -euo pipefail
          OH_AGENT_CANVAS_SECRET_KEY="$(openssl rand -base64 32)" \
            ./scripts/stax-preflight.sh openhands

      - name: AP_REDIS_USE_SSL=false must be rejected
        run: |
          set -euo pipefail
          # Upstream #4857: "false" still negotiates TLS — only absence
          # disables it. If preflight ever stops catching that spelling, an
          # operator gets a confusing connect-time failure instead.
          # Written with echo rather than a heredoc on purpose: an unindented
          # heredoc is not possible at this indentation level, and `lookup` in
          # the preflight script anchors on ^VAR= — leading spaces would make
          # every value read as unset and this test would pass for the wrong
          # reason.
          mkdir -p activepieces
          {
            echo "AP_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef"
            echo "AP_JWT_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
            echo "AP_FRONTEND_URL=https://flows.example.com"
            echo "AP_POSTGRES_URL=postgres://u:p@ap-postgres:5432/activepieces"
            echo "AP_REDIS_HOST=ap-redis"
            echo "AP_REDIS_USE_SSL=false"
          } > activepieces/.env
          # Guard against exactly the failure mode described above: prove the
          # file really parses before trusting what the next assertion means.
          grep -q '^AP_REDIS_USE_SSL=false$' activepieces/.env
          if ./scripts/stax-preflight.sh workflow; then
            echo "preflight accepted AP_REDIS_USE_SSL=false — it must not" >&2
            exit 1
          fi
          echo "Correctly rejected."

      - name: A wrong-length AP_ENCRYPTION_KEY must be rejected
        run: |
          set -euo pipefail
          # Activepieces requires exactly 32 hex chars; a wrong length fails at
          # boot rather than degrading, so it is worth catching before deploy.
          sed -i 's|^AP_ENCRYPTION_KEY=.*|AP_ENCRYPTION_KEY=tooshort|' activepieces/.env
          sed -i '/^AP_REDIS_USE_SSL=/d' activepieces/.env
          if ./scripts/stax-preflight.sh workflow; then
            echo "preflight accepted a short AP_ENCRYPTION_KEY — it must not" >&2
            exit 1
          fi
          echo "Correctly rejected."

      - name: A valid workflow config must be accepted
        run: |
          set -euo pipefail
          sed -i "s|^AP_ENCRYPTION_KEY=.*|AP_ENCRYPTION_KEY=$(openssl rand -hex 16)|" activepieces/.env
          ./scripts/stax-preflight.sh workflow
          rm -f activepieces/.env

      - name: Shell lint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh

  # Our own code, with no OmniRoute anywhere near it.
  #
  # The `agent-sidecar` job below is an integration test and rightly builds
  # omniroute:base first. But that build currently fails for a reason outside
  # this repo — tls-client-node looks for a release asset upstream renamed, see
  # the closing section of docs/king-mistakes.md — and while it fails it takes
  # every test in this service down with it, including the ~580 lines that
  # never needed OmniRoute at all. That is how a dict/str regression in
  # test_smoke.py survived from 2026-09-01 to 2026-09-04 unnoticed.
  #
  # test_smoke.py skips itself when no key is set (it short-circuits before it
  # would try the network), so the suite runs clean with nothing else running.
  #
  # This job must never acquire a dependency on omniroute:base. Being the one
  # thing that still reports on our own code when the vendored build is broken
  # is its entire reason to exist.
  agent-sidecar-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the sidecar image on its own
        run: docker build -t king-agent-sidecar:ci ./agent-sidecar

      - name: Run the suite with no OmniRoute reachable
        run: docker run --rm king-agent-sidecar:ci uv run pytest tests/ -v

  agent-sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate CI-only secrets and write omniroute/.env
        run: |
          set -euo pipefail
          cp omniroute/.env.example omniroute/.env
          JWT_SECRET=$(openssl rand -base64 48)
          API_KEY_SECRET=$(openssl rand -hex 32)
          INITIAL_PASSWORD=$(openssl rand -base64 18)
          echo "::add-mask::${JWT_SECRET}"
          echo "::add-mask::${API_KEY_SECRET}"
          echo "::add-mask::${INITIAL_PASSWORD}"
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${JWT_SECRET}|" omniroute/.env
          sed -i "s|^API_KEY_SECRET=.*|API_KEY_SECRET=${API_KEY_SECRET}|" omniroute/.env
          sed -i "s|^INITIAL_PASSWORD=.*|INITIAL_PASSWORD=${INITIAL_PASSWORD}|" omniroute/.env
          sed -i "s|^# OMNIROUTE_DISABLE_BACKGROUND_SERVICES=false|OMNIROUTE_DISABLE_BACKGROUND_SERVICES=true|" omniroute/.env
          echo "INITIAL_PASSWORD=${INITIAL_PASSWORD}" >> "$GITHUB_ENV"

      - name: Provide omniroute:base (pull the pinned published image)
        run: ./scripts/ci-build-omniroute-base.sh

      - name: Start OmniRoute (base profile, reuses the pre-built image)
        run: docker compose -f docker-compose.yml --profile base up -d

      - name: Wait for OmniRoute /healthz
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            if curl -sf http://localhost:20128/healthz >/dev/null; then
              echo "Ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "OmniRoute did not become healthy in time" >&2
          docker compose -f docker-compose.yml --profile base logs
          exit 1

      - name: Provision a scoped OMNIROUTE_API_KEY for the sidecar
        run: |
          set -euo pipefail
          curl -sf -c cookies.txt -X POST http://localhost:20128/api/auth/login \
            -H "Content-Type: application/json" \
            -d "{\"password\":\"${INITIAL_PASSWORD}\"}" >/dev/null
          KEY_JSON=$(curl -sf -b cookies.txt -X POST http://localhost:20128/api/keys \
            -H "Content-Type: application/json" \
            -d '{"name":"ci-agent-sidecar","scopes":["models","routing","health"]}')
          KEY=$(echo "$KEY_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['key'])")
          echo "::add-mask::${KEY}"
          echo "SIDECAR_API_KEY=${KEY}" >> "$GITHUB_ENV"

      - name: Build agent-sidecar image
        # Both profiles are required here, not just agent-sidecar: Compose
        # resolves `depends_on` against the profile-filtered project model,
        # and agent-sidecar depends_on omniroute-base, which only exists
        # under the `base` profile (from the included
        # omniroute/docker-compose.yml). Omitting --profile base makes
        # omniroute-base "undefined" to this command even though it's
        # already running — confirmed via the real error message:
        # `service "agent-sidecar" depends on undefined service
        # "omniroute-base": invalid compose project`. The later
        # logs/down steps in this job already pass both profiles; this
        # step and the next one didn't.
        run: docker compose -f docker-compose.yml --profile base --profile agent-sidecar build agent-sidecar

      - name: Run agent-sidecar pytest suite against live OmniRoute
        run: |
          docker compose -f docker-compose.yml --profile base --profile agent-sidecar run --rm \
            -e OMNIROUTE_API_KEY="${SIDECAR_API_KEY}" \
            -e AGENT_SIDECAR_MODEL_ID=opencode/big-pickle \
            agent-sidecar uv run pytest tests/ -v

      - name: Give the wrapper its key the way a deployment does
        run: |
          set -euo pipefail
          # The step above passes the key with `-e` because it runs a one-shot
          # container. The wrapper is a long-lived service and reads
          # agent-sidecar/.env (env_file in docker-compose.yml), which is also
          # where docs/integrations/activepieces-workflow.md tells an operator
          # to put it — so configure it the same way here rather than
          # inventing a CI-only path.
          #
          # AGENT_SIDECAR_AUTH_TOKEN is not optional any more. Without it the
          # wrapper answers every /run with 503 "not configured; refusing all
          # requests" — correct fail-closed behaviour, and something this job
          # did not notice for weeks because it never got this far: the
          # omniroute build failed first. The end-to-end step below was posting
          # with no Authorization header, and had been since auth went in.
          TOKEN=$(openssl rand -hex 24)
          echo "::add-mask::${TOKEN}"
          echo "SIDECAR_AUTH_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
          {
            echo "OMNIROUTE_API_KEY=${SIDECAR_API_KEY}"
            echo "AGENT_SIDECAR_MODEL_ID=opencode/big-pickle"
            echo "AGENT_SIDECAR_AUTH_TOKEN=${TOKEN}"
          } > agent-sidecar/.env
          chmod 600 agent-sidecar/.env

      - name: Start the HTTP wrapper
        run: |
          docker compose -f docker-compose.yml --profile base --profile agent-sidecar-http up -d agent-sidecar-http

      - name: Wait for the wrapper to report healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8100/healthz >/dev/null; then
              echo "Wrapper ready after $((i * 2))s"
              curl -sf http://localhost:8100/healthz
              exit 0
            fi
            sleep 2
          done
          echo "HTTP wrapper did not become healthy in time" >&2
          docker compose -f docker-compose.yml --profile base --profile agent-sidecar-http logs --tail=200 agent-sidecar-http
          exit 1

      - name: The wrapper must not leak the API key it was given
        run: |
          set -euo pipefail
          # /healthz reports whether a key is configured, never the key. This
          # asserts that with a real key actually loaded, so a future change
          # that starts echoing settings back cannot pass unnoticed.
          BODY=$(curl -sf http://localhost:8100/healthz)
          echo "$BODY" | grep -q '"omniroute_api_key_set":true'
          if echo "$BODY" | grep -qF "${SIDECAR_API_KEY}"; then
            echo "/healthz leaked the API key" >&2
            exit 1
          fi
          echo "No key material in the health payload."

      - name: A real task must run end to end over HTTP
        run: |
          set -euo pipefail
          # The whole point of this profile: a workflow step is an HTTP call,
          # so prove a real agent run completes through one — reaching
          # OmniRoute, not a stub.
          #
          # -sf is deliberately absent: a 500 body carries the runner's own
          # error message, which is what distinguishes the two cases below.
          RESP=$(curl -s -X POST http://localhost:8100/run \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${SIDECAR_AUTH_TOKEN}" \
            --max-time 300 \
            -d '{"task":"Say exactly: HTTP-WRAPPER-OK, nothing else."}')
          echo "$RESP"
          if echo "$RESP" | grep -q "HTTP-WRAPPER-OK"; then
            echo "Agent ran end to end over HTTP."
            exit 0
          fi
          # opencode/big-pickle is a free, keyless, best-effort provider. When
          # it is down the runner raises and the wrapper returns that message
          # verbatim — which proves the request reached the wrapper, the
          # runner, and OmniRoute. Only the model call itself is unproven.
          if echo "$RESP" | grep -qE "service_unavailable|Upstream request failed"; then
            echo "::warning::Upstream free provider unavailable. The HTTP wrapper" \
                 "and its path to OmniRoute are proven; the agent result is not."
            exit 0
          fi
          echo "Unexpected response from the wrapper" >&2
          exit 1

      - name: An unauthenticated run must be refused
        run: |
          set -euo pipefail
          # This is the assertion whose absence let the bearer regression sit
          # unnoticed. Every other check here sends a valid token, so none of
          # them can tell "auth is enforced" from "auth is off" — the two look
          # identical from a request that carries the right header.
          #
          # 401 is the answer for a configured wrapper; 403 would also be a
          # refusal. 200 means the door is open, and 503 means the wrapper has
          # no token at all, which is fail-closed but also means the run above
          # proved nothing.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8100/run \
            -H 'Content-Type: application/json' \
            -d '{"task":"this must never execute"}')
          case "$code" in
            401|403) echo "Unauthenticated /run refused with $code." ;;
            200) echo "/run executed a task with no bearer token." >&2; exit 1 ;;
            503) echo "Wrapper reports no token configured; the authenticated run above proved nothing." >&2; exit 1 ;;
            *)   echo "Unauthenticated /run returned $code; expected 401." >&2; exit 1 ;;
          esac

          wrong=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8100/run \
            -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer not-the-token' \
            -d '{"task":"this must never execute"}')
          if [ "$wrong" != "401" ] && [ "$wrong" != "403" ]; then
            echo "A wrong bearer returned $wrong instead of 401." >&2
            exit 1
          fi
          echo "A wrong bearer is refused with $wrong."

      - name: Bad requests must be rejected, not 500
        run: |
          set -euo pipefail
          # Authenticated on purpose: these assert the *validation* path, and
          # an unauthenticated request would be rejected before reaching it —
          # every case would "pass" for the wrong reason.
          for body in '{}' '{"task":""}' '{"task":"t","runner":"nope"}'; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8100/run \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${SIDECAR_AUTH_TOKEN}" -d "$body")
            if [ "$code" != "400" ]; then
              echo "expected 400 for $body, got $code" >&2
              exit 1
            fi
          done
          echo "All malformed requests correctly rejected with 400."

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml --profile base --profile agent-sidecar             --profile agent-sidecar-http logs --tail=300

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml --profile base --profile agent-sidecar             --profile agent-sidecar-http down -v

  # Needs no OmniRoute, so it runs in a couple of minutes rather than behind a
  # gateway build. It extracts THIS repository, which is also the corpus the
  # deployment serves, so the assertions below are about real output.
  codegraph:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preflight rejects an unauthenticated graph, and accepts a real key
        run: |
          set -euo pipefail
          if ./scripts/stax-preflight.sh codegraph; then
            echo "preflight passed with GRAPHIFY_API_KEY unset — the graph would be served with no auth" >&2
            exit 1
          fi
          echo "GRAPHIFY_API_KEY=$(openssl rand -hex 24)" > .env
          ./scripts/stax-preflight.sh codegraph

      - name: Plant a canary secret in a gitignored path
        run: |
          set -euo pipefail
          # Asserted after the build. The build mounts the whole repo and the
          # result is served behind a single static key, so anything the
          # extractor reads becomes queryable by whoever holds that key.
          mkdir -p agent-sidecar
          printf 'SECRET=%s\n' "CODEGRAPH-CANARY-b7f3e91a4c2d" > agent-sidecar/.env
          git check-ignore -q agent-sidecar/.env  # fails loudly if it is not actually ignored

      - name: Build the graph
        run: |
          set -euo pipefail
          CODEGRAPH_COMMIT="${{ github.sha }}" CODEGRAPH_WORKERS=4 \
            docker compose --profile codegraph run --rm -T --build codegraph-build

      - name: Assert the graph is real, and records what it was built from
        run: |
          set -euo pipefail
          read -r nodes edges <<<"$(docker compose --profile codegraph run --rm -T --no-deps \
            --entrypoint python codegraph-serve -c \
            'import json;g=json.load(open("/out/graphify-out/graph.json"));print(len(g["nodes"]),len(g["edges"]))' | tr -d '\r')"
          echo "nodes=$nodes edges=$edges"
          # Measured on the VPS at 58,382 nodes. A floor rather than an equality:
          # the number moves with the code, but halving means a broken extraction.
          if [ "$nodes" -lt 40000 ]; then
            echo "only $nodes nodes — extraction is broken, not merely smaller" >&2
            exit 1
          fi
          built=$(docker compose --profile codegraph run --rm -T --no-deps --entrypoint sh \
            codegraph-serve -c 'sed -n "s/^commit=//p" /out/graphify-out/BUILD_INFO' | tr -d '\r\n')
          if [ "$built" != "${{ github.sha }}" ]; then
            echo "BUILD_INFO says $built, expected ${{ github.sha }} — staleness detection would not work" >&2
            exit 1
          fi

      - name: The canary did not reach the graph
        run: |
          set -euo pipefail
          # graphify honours .gitignore, and codegraph-build masks the .env
          # files with /dev/null besides. This proves the combination holds
          # rather than assuming it.
          hits=$(docker compose --profile codegraph run --rm -T --no-deps --entrypoint sh \
            codegraph-serve -c "grep -c 'CODEGRAPH-CANARY-b7f3e91a4c2d' /out/graphify-out/graph.json || true" | tr -d '\r')
          echo "canary occurrences in graph.json: ${hits:-0}"
          if [ "${hits:-0}" -ne 0 ]; then
            echo "a gitignored secret was extracted into the served graph" >&2
            exit 1
          fi
          rm -f agent-sidecar/.env

      - name: Serve refuses to start without a graph
        run: |
          set -euo pipefail
          if docker compose --profile codegraph run --rm -T --no-deps --entrypoint sh codegraph-serve \
               -c 'test -s /nonexistent/graph.json'; then
            echo "guard did not fire" >&2; exit 1
          fi
          echo "guard fires on a missing graph"

      - name: Serve answers MCP with the key, and refuses without it
        run: |
          set -euo pipefail
          docker compose --profile codegraph up -d codegraph-serve
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose --profile codegraph ps -q codegraph-serve)")" = healthy ] && break
            sleep 3
          done
          # The healthcheck passing IS the authenticated-initialize assertion —
          # it performs a real MCP handshake with the key on every interval.
          docker inspect -f '{{.State.Health.Status}}' \
            "$(docker compose --profile codegraph ps -q codegraph-serve)" | grep -qx healthy
          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8130/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d "$body")
          echo "unauthenticated initialize -> $code"
          if [ "$code" = "200" ]; then
            echo "the code graph answered an unauthenticated request" >&2; exit 1
          fi

      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile codegraph logs --tail=300

      - name: Tear down
        if: always()
        run: docker compose --profile codegraph down -v

  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate CI-only secrets and write observability/.env
        run: |
          set -euo pipefail
          {
            echo "SALT=$(openssl rand -hex 32)"
            echo "ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "NEXTAUTH_SECRET=$(openssl rand -hex 32)"
            echo "NEXTAUTH_URL=http://localhost:3000"
            echo "POSTGRES_USER=postgres"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DB=postgres"
            echo "CLICKHOUSE_USER=clickhouse"
            echo "CLICKHOUSE_PASSWORD=$(openssl rand -hex 24)"
            echo "MINIO_ROOT_USER=minio"
            echo "MINIO_ROOT_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_AUTH=$(openssl rand -hex 24)"
            echo "LANGFUSE_REDIS_PORT=16379"
          } > observability/.env
          # DATABASE_URL references POSTGRES_PASSWORD — expand it into the file
          # the same way an operator following .env.example by hand would.
          PGPASS=$(grep '^POSTGRES_PASSWORD=' observability/.env | cut -d= -f2-)
          echo "DATABASE_URL=postgresql://postgres:${PGPASS}@postgres:5432/postgres" >> observability/.env

      - name: Build and start Langfuse (observability profile — standalone, no OmniRoute needed)
        run: docker compose -f docker-compose.yml --profile observability --env-file observability/.env up -d --build

      - name: Wait for Langfuse health (API alive + database reachable)
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl -sf "http://localhost:3000/api/public/health?failIfDatabaseUnavailable=true" >/dev/null; then
              echo "Langfuse ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "Langfuse did not become healthy in time" >&2
          docker compose -f docker-compose.yml --profile observability logs
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml --profile observability logs --tail=300

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml --profile observability down -v

  openhands:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate CI-only secrets and write omniroute/.env
        run: |
          set -euo pipefail
          cp omniroute/.env.example omniroute/.env
          JWT_SECRET=$(openssl rand -base64 48)
          API_KEY_SECRET=$(openssl rand -hex 32)
          INITIAL_PASSWORD=$(openssl rand -base64 18)
          echo "::add-mask::${JWT_SECRET}"
          echo "::add-mask::${API_KEY_SECRET}"
          echo "::add-mask::${INITIAL_PASSWORD}"
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${JWT_SECRET}|" omniroute/.env
          sed -i "s|^API_KEY_SECRET=.*|API_KEY_SECRET=${API_KEY_SECRET}|" omniroute/.env
          sed -i "s|^INITIAL_PASSWORD=.*|INITIAL_PASSWORD=${INITIAL_PASSWORD}|" omniroute/.env
          sed -i "s|^# OMNIROUTE_DISABLE_BACKGROUND_SERVICES=false|OMNIROUTE_DISABLE_BACKGROUND_SERVICES=true|" omniroute/.env
          echo "OH_AGENT_CANVAS_SECRET_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Provide omniroute:base (pull the pinned published image)
        run: ./scripts/ci-build-omniroute-base.sh

      - name: Start OmniRoute + OpenHands Agent Canvas (reuses the pre-built image)
        run: docker compose -f docker-compose.yml --profile base --profile openhands up -d

      - name: Wait for OmniRoute /healthz
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            if curl -sf http://localhost:20128/healthz >/dev/null; then
              echo "OmniRoute ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "OmniRoute did not become healthy in time" >&2
          exit 1

      - name: Wait for OpenHands Agent Canvas to respond
        run: |
          set -euo pipefail
          # This check used to pass without checking anything. When curl cannot
          # connect it still prints `000` via -w AND exits non-zero, so the old
          # `|| echo 000` appended a second `000` and the guard compared
          # "000000" != "000" -> true. It reported success on the very first
          # attempt, 2s in, while the container was still booting. Confirmed
          # from a real run's log: "responded with HTTP 000000 after 2s".
          #
          # Assigning the fallback to the variable instead of echoing into the
          # substitution keeps the failure value exactly "000". Any real status
          # counts as alive on purpose — this only proves the server is
          # listening, and an auth redirect or 403 proves that just as well
          # as a 200 does.
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:8000/) || code="000"
            if [ "$code" != "000" ]; then
              echo "OpenHands Agent Canvas responded with HTTP $code after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "OpenHands Agent Canvas did not respond in time" >&2
          docker compose -f docker-compose.yml --profile base --profile openhands logs
          exit 1

      - name: Note — LLM wiring is a manual UI step, not covered by this smoke test
        run: |
          echo "This job only proves the container boots and serves HTTP." \
               "The Settings > LLM wiring documented in" \
               "docs/integrations/openhands-agent-canvas.md is a one-time manual step," \
               "not automated here."

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml --profile base --profile openhands logs --tail=300

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml --profile base --profile openhands down -v

  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate CI-only secrets and write omniroute/.env
        run: |
          set -euo pipefail
          cp omniroute/.env.example omniroute/.env
          JWT_SECRET=$(openssl rand -base64 48)
          API_KEY_SECRET=$(openssl rand -hex 32)
          INITIAL_PASSWORD=$(openssl rand -base64 18)
          echo "::add-mask::${JWT_SECRET}"
          echo "::add-mask::${API_KEY_SECRET}"
          echo "::add-mask::${INITIAL_PASSWORD}"
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${JWT_SECRET}|" omniroute/.env
          sed -i "s|^API_KEY_SECRET=.*|API_KEY_SECRET=${API_KEY_SECRET}|" omniroute/.env
          sed -i "s|^INITIAL_PASSWORD=.*|INITIAL_PASSWORD=${INITIAL_PASSWORD}|" omniroute/.env
          sed -i "s|^# OMNIROUTE_DISABLE_BACKGROUND_SERVICES=false|OMNIROUTE_DISABLE_BACKGROUND_SERVICES=true|" omniroute/.env

      - name: Write activepieces/.env pointing at the CI-only Postgres and Redis
        run: |
          set -euo pipefail
          AP_CI_POSTGRES_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::${AP_CI_POSTGRES_PASSWORD}"
          echo "AP_CI_POSTGRES_PASSWORD=${AP_CI_POSTGRES_PASSWORD}" >> "$GITHUB_ENV"
          # AP_REDIS_USE_SSL is deliberately ABSENT rather than "false":
          # upstream #4857 means the literal "false" still negotiates TLS,
          # which the CI Redis does not speak. This job is therefore also a
          # live check that the advice in .env.example is the correct advice.
          {
            echo "AP_ENCRYPTION_KEY=$(openssl rand -hex 16)"
            echo "AP_JWT_SECRET=$(openssl rand -hex 32)"
            echo "AP_FRONTEND_URL=http://localhost:8080"
            echo "AP_POSTGRES_URL=postgres://activepieces:${AP_CI_POSTGRES_PASSWORD}@ap-postgres:5432/activepieces"
            echo "AP_REDIS_TYPE=STANDALONE"
            echo "AP_REDIS_HOST=ap-redis"
            echo "AP_REDIS_PORT=6379"
            echo "AP_EXECUTION_MODE=UNSANDBOXED"
            echo "AP_ENVIRONMENT=prod"
            echo "AP_TELEMETRY_ENABLED=false"
          } > activepieces/.env

      - name: Preflight must pass for base + workflow
        run: ./scripts/stax-preflight.sh base workflow

      - name: Provide omniroute:base (pull the pinned published image)
        run: ./scripts/ci-build-omniroute-base.sh

      - name: Start OmniRoute + Activepieces
        run: |
          docker compose -f docker-compose.yml -f activepieces/docker-compose.ci.yml \
            --profile base --profile workflow up -d

      - name: Wait for OmniRoute /healthz
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            if curl -sf http://localhost:20128/healthz >/dev/null; then
              echo "OmniRoute ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "OmniRoute did not become healthy in time" >&2
          exit 1

      - name: Wait for Activepieces API (proves schema migration + DB reachable)
        run: |
          set -euo pipefail
          # /api/v1/flags is unauthenticated and reads from the database, so a
          # 200 here proves more than "the port is open": it proves the schema
          # migrated onto Postgres and the API can query it.
          for i in $(seq 1 150); do
            if curl -sf http://localhost:8080/api/v1/flags >/dev/null; then
              echo "Activepieces ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "Activepieces did not become healthy in time" >&2
          docker compose -f docker-compose.yml -f activepieces/docker-compose.ci.yml \
            --profile base --profile workflow logs --tail=200 activepieces
          exit 1

      - name: Activepieces must reach OmniRoute over the compose network
        run: |
          set -euo pipefail
          # This is the path a real "HTTP Request" step in a flow takes, and
          # the reason the AI Provider base URL is the Docker hostname rather
          # than localhost. Run from inside the container so it proves the
          # network route, not the runner's own access.
          docker compose -f docker-compose.yml -f activepieces/docker-compose.ci.yml \
            --profile base --profile workflow exec -T activepieces \
            node -e '
              fetch("http://omniroute-base:20128/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  model: "opencode/big-pickle",
                  messages: [{ role: "user", content: "Reply with the single word: pong" }],
                }),
              })
                .then(async (r) => {
                  const text = await r.text();
                  if (r.ok) {
                    const content = JSON.parse(text)?.choices?.[0]?.message?.content;
                    if (!content) throw new Error("no assistant content: " + text.slice(0, 400));
                    console.log("OmniRoute replied:", JSON.stringify(content).slice(0, 200));
                    return;
                  }
                  // opencode/big-pickle is a free, keyless, best-effort
                  // provider. When it is down OmniRoute answers 503
                  // service_unavailable, and that reply is itself proof the
                  // request crossed the compose network, reached OmniRoute and
                  // was routed onward, which is what this step exists to check.
                  // Failing on it would make a third party the arbiter of this
                  // repo build status; observed for real in run 33047603557.
                  let body = null;
                  try { body = JSON.parse(text); } catch (_) { /* not JSON */ }
                  if (r.status === 503 && body && body.error && body.error.code === "service_unavailable") {
                    console.log("::warning::Upstream free provider unavailable. The " +
                      "Activepieces to OmniRoute path is proven; the completion is not. " +
                      text.slice(0, 200));
                    return;
                  }
                  throw new Error("HTTP " + r.status + ": " + text.slice(0, 400));
                })
                .catch((e) => { console.error(e.message); process.exit(1); });
            '

      - name: Note — the AI Provider wiring is a manual UI step, not covered here
        run: |
          echo "This job proves the container boots, migrates, serves its API," \
               "and can reach OmniRoute over the compose network. The" \
               "Admin > AI Providers wiring documented in" \
               "docs/integrations/activepieces-workflow.md is a one-time manual step."

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f activepieces/docker-compose.ci.yml \
            --profile base --profile workflow logs --tail=300

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f activepieces/docker-compose.ci.yml \
            --profile base --profile workflow down -v
