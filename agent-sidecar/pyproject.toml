[project]
name = "stax-agent-sidecar"
version = "0.1.0"
description = "STAX agent-sidecar — smolagents + pydantic-ai runners using OmniRoute as LLM backend and MCP tool source."
requires-python = ">=3.11"
dependencies = [
    # `e2b` and `modal` are the two off-host sandboxes this deployment will
    # accept. `docker` is deliberately excluded even though smolagents offers
    # it: DockerExecutor uses docker.from_env(), so from inside this container
    # it needs the host's Docker socket — root-equivalent host access handed to
    # the one service that runs model-written code by design. `blaxel` is
    # excluded because the operator chose not to use it.
    #
    # Both extras are light: e2b pulls e2b-code-interpreter and python-dotenv,
    # modal pulls modal and websocket-client. Neither drags in torch.
    "smolagents[toolkit,mcp,e2b,modal]>=1.0.0",
    "pydantic-ai>=1.0.0",
    "httpx>=0.27",
    # Both already arrive transitively via `mcp`, so declaring them adds no
    # package to the image — but agent_sidecar.server imports them directly,
    # and a direct import backed only by someone else's dependency breaks
    # silently the day that dependency drops it.
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sidecar"]
