# KING root — thin wrapper so `docker compose up` works from repo root.
# Delegates entirely to the vendored OmniRoute compose file; see omniroute/docker-compose.yml
# for the full profile list (base, web, cli, host, cliproxyapi, memory, bifrost).
# Also includes STAX's own opt-in profiles — see docs/integrations/scalability-system.md.
#
# Deploying to a VPS: run `./scripts/stax-preflight.sh` first. Compose cannot
# gate a required variable per-profile (`${VAR:?err}` is interpolated across
# the whole merged model before profile filtering — verified, see
# docs/integrations/vps-hardening.md), so the placeholder-secret and
# public-binding checks live in that script instead of in this file.
include:
  - path: omniroute/docker-compose.yml
  - path: observability/docker-compose.langfuse.yml

# Docker's default json-file driver has NO size cap, so a chatty container
# fills the disk until the host stops working — a failure that arrives as
# "everything broke at once" rather than as anything pointing at logs. This
# host has 20 GB free. Every service defined below carries this; the vendored
# omniroute/ and observability/ files are left alone under the never-edit rule.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # NOTE: this file deliberately declares NO service that omniroute/ already
  # defines. The Compose spec is explicit that an including file cannot
  # override an included resource, and a partial `omniroute-base:` override
  # here — added to mount a plugins directory and pass two OTel variables —
  # turned every Docker CI job red with
  # `services.omniroute-base conflicts with imported resource`.
  #
  # It went unnoticed because Compose v5.3+ accepts it and the VPS runs v5.5,
  # so it worked in both places a human looked. Anything OmniRoute needs goes
  # in omniroute/.env (the vendored file reads it via `env_file: .env`), not
  # in a redeclaration here.

  # Auth shim between OmniRoute and Langfuse, nothing more.
  #
  # OmniRoute's built-in OTLP exporter is the only tracing path that lives in
  # the gateway core rather than the plugin runtime — which matters, because
  # the plugin runtime does not invoke its hooks in this deployment (the
  # example Langfuse plugin was proven to work standalone and still never
  # fired through the gateway). But that exporter sends exactly one header,
  # `Content-Type: application/json`, and Langfuse requires Basic auth. This
  # container adds the credentials the exporter cannot.
  #
  # Never publish 4318 to the host: anything that reaches it can write traces
  # into your Langfuse project without authenticating.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    environment:
      # Soft defaults, not ${VAR:?err} — the usual reason: a required
      # variable here is interpolated across the whole merged model before
      # profile filtering and would break `--profile base up` for anyone who
      # never asked for tracing. stax-preflight.sh enforces these instead.
      - LANGFUSE_OTLP_ENDPOINT=${LANGFUSE_OTLP_ENDPOINT:-https://cloud.langfuse.com/api/public/otel}
      # "Basic " + base64("pk-lf-...:sk-lf-..."). The collector has no base64
      # function, so this must arrive pre-encoded.
      - LANGFUSE_OTLP_AUTH=${LANGFUSE_OTLP_AUTH:-CHANGEME-basic-base64}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: ${OTEL_COLLECTOR_MEM_LIMIT:-256m}
    cpus: ${OTEL_COLLECTOR_CPUS:-0.5}
    logging: *default-logging
    profiles:
      - tracing

  agent-sidecar:
    build: ./agent-sidecar
    image: king-agent-sidecar:local
    env_file:
      - path: agent-sidecar/.env
        required: false
    environment:
      - OMNIROUTE_BASE_URL=http://omniroute-base:${DASHBOARD_PORT:-20128}
      # smolagents' CodeAgent executes model-generated Python. "local" runs it
      # inside THIS container, guarded only by an AST-level import allowlist —
      # smolagents documents that as not a security boundary. That is fine
      # while every task arrives from an operator on the command line, which
      # is the only way this service is invoked today.
      #
      # Do NOT reach for "docker" as the hardened option: smolagents'
      # DockerExecutor uses docker.from_env(), so from inside this container
      # it needs the host's Docker socket mounted in — root-equivalent host
      # access, handed to the one service that runs model-written code by
      # design. If task text ever starts arriving from outside an operator's
      # shell, move execution off this host instead ("e2b", "modal",
      # "blaxel"), which needs no local daemon.
      # See docs/integrations/vps-hardening.md.
      - AGENT_SIDECAR_EXECUTOR=${AGENT_SIDECAR_EXECUTOR:-local}
      # Read config.py before setting this: under `local` it RESTRICTS imports
      # and is the whole boundary, under e2b/modal smolagents pip-installs it
      # and restricts nothing.
      - AGENT_SIDECAR_AUTHORIZED_IMPORTS=${AGENT_SIDECAR_AUTHORIZED_IMPORTS:-}
      # Which MCP tools the agent may hold, by exact name. An ALLOWLIST:
      # empty uses the read-mostly default in config.py, "none" gives it none.
      # OmniRoute serves 110 tools and two of the twelve it tags "phase 1"
      # rewrite live routing, so the default is not that tag.
      #
      # This does nothing without OMNIROUTE_MCP_API_KEY, which is a separately
      # provisioned `manage`-scoped key and comes from agent-sidecar/.env — it
      # must never be written here, where it would be committable.
      - AGENT_SIDECAR_AGENT_TOOLS=${AGENT_SIDECAR_AGENT_TOOLS:-}
      # Hosts the MCP endpoint accepts in the Host header. Behind a reverse
      # proxy this must include the public name, or every request comes back
      # "Invalid Host header". Empty leaves loopback-only, which is correct
      # when nothing proxies to it.
      - AGENT_SIDECAR_MCP_ALLOWED_HOSTS=${AGENT_SIDECAR_MCP_ALLOWED_HOSTS:-}
    depends_on:
      omniroute-base:
        condition: service_healthy
    # One-shot runner, not a long-lived service: it executes its CMD and
    # exits, so `up -d` must not treat that exit as a crash to restart.
    restart: "no"
    security_opt:
      # Blocks setuid escalation inside the container. Safe here because the
      # image runs a plain Python process as a non-root user and never needs
      # to gain privileges (see agent-sidecar/Dockerfile).
      - no-new-privileges:true
    # A VPS has far less headroom than a CI runner, and this session already
    # hit real OOM behaviour building this same stack. Bound it explicitly.
    mem_limit: ${AGENT_SIDECAR_MEM_LIMIT:-1g}
    cpus: ${AGENT_SIDECAR_CPUS:-1.0}
    logging: *default-logging
    profiles:
      - agent-sidecar

  openhands-agent-canvas:
    # Pinned by digest, not a semver tag: the upstream image has no semver
    # releases (verified against the GHCR registry API — only `latest`,
    # `main`, and sha-/PR-based tags exist). `main`'s digest as of
    # 2026-08-23 — see docs/integrations/openhands-agent-canvas.md for how
    # to refresh this.
    image: ghcr.io/openhands/agent-canvas@sha256:becb2c0cdebb4427304c4476c34b0c9bf9ddd50e7a0abee444c764c2151ab1b3
    ports:
      # Loopback-only by default — the same rule omniroute/docker-compose.yml
      # already applies to its own password-less Redis, and for the same
      # reason its comment gives: a bare "8000:8000" binds 0.0.0.0, which on
      # a VPS publishes this agent control panel on every interface.
      #
      # This is deliberately stricter than OmniRoute's own dashboard binding,
      # because the dashboard authenticates (INITIAL_PASSWORD + JWT) and this
      # container is not known to. Upstream documents no authentication env
      # var for it other than LOCAL_BACKEND_API_KEY, which their docs scope to
      # `--public` mode; absent a documented default-auth guarantee, assume
      # there is none. Reach it over an SSH tunnel
      # (`ssh -L 8000:127.0.0.1:8000 vps`) or put a reverse proxy with TLS and
      # auth in front before ever setting OPENHANDS_CANVAS_BIND_HOST=0.0.0.0.
      - "${OPENHANDS_CANVAS_BIND_HOST:-127.0.0.1}:${OPENHANDS_CANVAS_PORT:-8000}:8000"
    volumes:
      - openhands-canvas-settings:/home/openhands/.openhands
      - ./:/projects/king
      # Secret masking. The whole-repo mount above would otherwise hand every
      # agent run the real contents of these gitignored .env files — OmniRoute's
      # JWT_SECRET, API_KEY_SECRET and INITIAL_PASSWORD, plus every provider
      # credential in them. Bind-mounting /dev/null over each path shadows it
      # inside this container only: reads return empty, `:ro` rejects writes,
      # and the files on the host are untouched and still work for every other
      # service. Deeper mount paths are applied after the parent bind mount,
      # which is what makes this layering work.
      #
      # These paths track the repo layout above them — if you change the
      # project mount, revisit this list.
      - /dev/null:/projects/king/omniroute/.env:ro
      - /dev/null:/projects/king/observability/.env:ro
      - /dev/null:/projects/king/agent-sidecar/.env:ro
      - /dev/null:/projects/king/activepieces/.env:ro
      # Not a .env, and that is exactly why it was missed. Claude Code appends
      # `permissions.allow` entries to this file verbatim, so whole commands —
      # including a live Neon connection string with its password — accumulate
      # in it in plaintext.
      - /dev/null:/projects/king/.claude/settings.local.json:ro
      # Deliberately left unmounted, as a settled decision rather than a
      # cautious default. Uncommenting this lets Agent Canvas spawn per-task
      # sandbox containers (upstream's safer runtime), but a container that
      # can create containers can create a privileged one that mounts the
      # host root filesystem — so the socket is root-equivalent, and no
      # socket proxy fixes that, because the escape IS container creation.
      #
      # Unmounted, agent code instead runs in this container, bounded by the
      # mounts above: worst case is a wrecked container and a dirtied repo
      # working copy, both recoverable. Mounted, worst case is the host, which
      # is not. Now that the port binds to loopback, the dominant threat is
      # the agent misbehaving rather than an external attacker — and that is
      # precisely the case where the bounded failure is the right one to
      # choose. See docs/integrations/vps-hardening.md.
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # CHANGEME: export OH_AGENT_CANVAS_SECRET_KEY (openssl rand -base64 32)
      # before actually using the `openhands` profile — the fallback below
      # is a placeholder, not a secret. Upstream uses this key to encrypt
      # stored LLM API keys and conversation secrets at rest, so leaving the
      # placeholder in place means encrypting them under a value published in
      # this repo's git history.
      #
      # Deliberately a soft default, not a hard-required ${VAR:?err}: that
      # form is interpolated across the whole merged compose model before
      # profiles are filtered, so it would break `--profile base` (plain
      # OmniRoute) for anyone who never asked for this service. Verified
      # directly, twice — it is the same class of bug as the Langfuse
      # redis/env_file issues. `./scripts/stax-preflight.sh` enforces this
      # instead, where the check can actually be scoped to the profile.
      - OH_SECRET_KEY=${OH_AGENT_CANVAS_SECRET_KEY:-CHANGEME-openssl-rand-base64-32}
      # - LOCAL_BACKEND_API_KEY=  # only required if you later run with --public
    depends_on:
      omniroute-base:
        condition: service_healthy
    # A control panel is meant to survive a VPS reboot, unlike agent-sidecar
    # above. Matches what omniroute/docker-compose.yml sets on its own
    # long-lived services.
    restart: unless-stopped
    # Deliberately no `no-new-privileges` here, unlike agent-sidecar: this is
    # a third-party image whose agent runtime may legitimately need to
    # escalate for in-sandbox package installs, and CI only proves it serves
    # HTTP — not that a hardened run stays healthy under real agent work.
    # Untested hardening that breaks at runtime is worse than none.
    mem_limit: ${OPENHANDS_CANVAS_MEM_LIMIT:-2g}
    cpus: ${OPENHANDS_CANVAS_CPUS:-2.0}
    logging: *default-logging
    profiles:
      - openhands

  # The same image and the same runners as agent-sidecar above, served over
  # HTTP so a workflow step can call them. Kept as a separate service rather
  # than a flag on that one because the two have opposite lifecycles: that one
  # is a one-shot process an operator runs and watches exit, this one is a
  # long-lived server. Only one of them needs to exist for a given deployment.
  #
  # Unauthenticated on purpose, and therefore loopback-only and never proxied:
  # it inherits agent-sidecar's threat model, where safety comes from the fact
  # that only things already inside this compose network can invoke it. If it
  # ever needs to be reachable from outside, it needs auth first — and the
  # executor decision in docs/integrations/vps-hardening.md has to be revisited
  # at the same time, because "tasks arrive from an operator's shell" would no
  # longer be true.
  agent-sidecar-http:
    build: ./agent-sidecar
    image: king-agent-sidecar:local
    command:
      - uv
      - run
      - uvicorn
      - agent_sidecar.server:app
      - --host
      - 0.0.0.0
      - --port
      - "8100"
    env_file:
      - path: agent-sidecar/.env
        required: false
    environment:
      - OMNIROUTE_BASE_URL=http://omniroute-base:${DASHBOARD_PORT:-20128}
      - AGENT_SIDECAR_EXECUTOR=${AGENT_SIDECAR_EXECUTOR:-local}
      # Read config.py before setting this: under `local` it RESTRICTS imports
      # and is the whole boundary, under e2b/modal smolagents pip-installs it
      # and restricts nothing.
      - AGENT_SIDECAR_AUTHORIZED_IMPORTS=${AGENT_SIDECAR_AUTHORIZED_IMPORTS:-}
      # Which MCP tools the agent may hold, by exact name. An ALLOWLIST:
      # empty uses the read-mostly default in config.py, "none" gives it none.
      # OmniRoute serves 110 tools and two of the twelve it tags "phase 1"
      # rewrite live routing, so the default is not that tag.
      #
      # This does nothing without OMNIROUTE_MCP_API_KEY, which is a separately
      # provisioned `manage`-scoped key and comes from agent-sidecar/.env — it
      # must never be written here, where it would be committable.
      - AGENT_SIDECAR_AGENT_TOOLS=${AGENT_SIDECAR_AGENT_TOOLS:-}
      # Hosts the MCP endpoint accepts in the Host header. Behind a reverse
      # proxy this must include the public name, or every request comes back
      # "Invalid Host header". Empty leaves loopback-only, which is correct
      # when nothing proxies to it.
      - AGENT_SIDECAR_MCP_ALLOWED_HOSTS=${AGENT_SIDECAR_MCP_ALLOWED_HOSTS:-}
      # Shell over MCP. OFF unless set — see the volumes note below for what
      # turning it on actually grants.
      - AGENT_SIDECAR_EXEC_ENABLED=${AGENT_SIDECAR_EXEC_ENABLED:-}
      - AGENT_SIDECAR_WORKDIR=/workspace
      - AGENT_SIDECAR_EXEC_AUDIT=/audit/vps_exec.log
    volumes:
      # Read this before enabling AGENT_SIDECAR_EXEC_ENABLED.
      #
      # The Docker socket IS root on this host. Anything holding it can start a
      # privileged container with / mounted, so no restriction applied to this
      # container — cap_drop, non-root user, the masks used elsewhere in this
      # file — limits what the socket grants. It is mounted because the
      # operator asked for full VPS access knowing that, and pretending
      # otherwise would be worse than saying it.
      #
      # What protects this is therefore not the container boundary:
      #   1. the tool is off unless AGENT_SIDECAR_EXEC_ENABLED is set
      #   2. the bearer token on /mcp, which fails closed
      #   3. the agent NEVER sees this tool — smolagents is built with
      #      tools=[], so text the agent reads on a web page cannot reach a
      #      shell. Claude has the operator's context; the agent has only what
      #      it read.
      #   4. every command is appended to /audit/vps_exec.log
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
      # A named volume, not a bind mount: the host directory is owned by the
      # host user and this container runs as uid 10001, so a bind mount is
      # present and unwritable — the audit log stayed empty while every
      # command ran, which is the worst shape for an audit trail. Read it with
      #   docker run --rm -v king_agent-audit:/a alpine cat /a/vps_exec.log
      - agent-audit:/audit
    # The socket is root:docker mode 660, and this image runs as uid 10001, so
    # without the docker group the mount above is present and unreadable — a
    # failure that looks like "docker is broken" rather than "no permission".
    # Measured on this host: gid 988. It is a host fact, not a portable one,
    # which is why it is a variable rather than a literal.
    group_add:
      - "${DOCKER_GID:-988}"
    ports:
      - "${AGENT_SIDECAR_HTTP_BIND_HOST:-127.0.0.1}:${AGENT_SIDECAR_HTTP_PORT:-8100}:8100"
    depends_on:
      omniroute-base:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://localhost:8100/healthz')
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # This container runs the Python a model writes. Nothing it does needs a
    # capability, so it gets none: no raw sockets, no mount, no chown, no
    # ptrace of anything else in the namespace.
    cap_drop:
      - ALL
    mem_limit: ${AGENT_SIDECAR_MEM_LIMIT:-1g}
    # Equal, like every other service here. Its absence was an oversight, and
    # it matters more on this one than most: an agent loop is the one thing in
    # this stack that can consume without bound, and without an equal swap
    # limit it thrashes the host instead of dying inside its own cgroup.
    memswap_limit: ${AGENT_SIDECAR_MEM_LIMIT:-1g}
    cpus: ${AGENT_SIDECAR_CPUS:-1.0}
    #
    # NOT set, and the reason is worth recording: `read_only: true` would be
    # the obvious next hardening step and it does not work here. The command
    # is `uv run`, which syncs the virtualenv on every start — a test run
    # visibly reports "Uninstalled 1 package, Installed 4 packages" — so a
    # read-only root filesystem stops the container booting. Making it
    # read-only means dropping `uv run` for a pre-resolved interpreter path,
    # which is a change to the image, not to this file.
    #
    # Egress is likewise NOT restricted. It would need agent-sidecar-http and
    # omniroute-base to share an `internal: true` network, and omniroute-base
    # is defined in the vendored omniroute/ compose file, which this repo must
    # never edit. Until the sandbox moves off-host (roadmap Phase 2c), model-
    # written code here can reach the internet.
    logging: *default-logging
    profiles:
      - agent-sidecar-http

  activepieces:
    # Pinned to the version upstream's own docker-compose.yml ships, not the
    # newest tag — that pairing is the one they publish as a working set. See
    # docs/integrations/activepieces-workflow.md for how to bump it.
    #
    # Open-core: MIT, except packages/ee/ which carries a separate enterprise
    # licence. Nothing in this profile touches those paths.
    image: ghcr.io/activepieces/activepieces:0.88.3
    ports:
      # Loopback-only, same rule as openhands-agent-canvas below: reach it
      # over an SSH tunnel (`ssh -L 8080:127.0.0.1:8080 vps`) for setup. It
      # does authenticate, but its webhook endpoints are unauthenticated by
      # design, so put it behind the `proxy` profile on its own subdomain
      # before exposing it — not on a bare public port.
      - "${AP_BIND_HOST:-127.0.0.1}:${AP_PORT:-8080}:80"
    env_file:
      # Everything lives here rather than in `environment:` below because
      # AP_REDIS_USE_SSL must be ABSENT to disable TLS — setting it to "false"
      # still makes Activepieces attempt a TLS handshake (upstream issue
      # #4857). A compose `${AP_REDIS_USE_SSL:-}` default would inject an
      # empty value and trip exactly that bug; an env_file simply omits it.
      - path: activepieces/.env
        required: false
    environment:
      # Left unset deliberately: AP_CONTAINER_TYPE defaults to
      # WORKER_AND_APP, so one container runs both roles. Upstream's own
      # compose splits them into app + 5 worker replicas, which is a
      # horizontal-scale layout this VPS has no headroom for and does not
      # need.
      - AP_QUEUE_MODE=${AP_QUEUE_MODE:-REDIS}
    depends_on:
      omniroute-base:
        condition: service_healthy
      ap-redis:
        condition: service_healthy
    restart: unless-stopped
    # Deliberately no `no-new-privileges`, for the same reason it is absent on
    # openhands-agent-canvas: this is a third-party image that installs piece
    # packages with npm at runtime, and nothing here has tested that a
    # hardened run survives that. Untested hardening that breaks at runtime is
    # worse than none.
    mem_limit: ${AP_MEM_LIMIT:-1536m}
    cpus: ${AP_CPUS:-1.0}
    volumes:
      - activepieces-cache:/usr/src/app/cache
    logging: *default-logging
    profiles:
      - workflow

  caddy:
    image: caddy:2-alpine
    ports:
      # Caddy is the one deliberately public entrypoint added by this
      # profile — it terminates TLS and reverse-proxies internally to
      # omniroute-base over the Docker network, so OmniRoute's own
      # published port never needs to be opened on the host firewall.
      # See docs/integrations/reverse-proxy-tls.md.
      - "80:80"
      - "443:443"
    environment:
      # Deliberately a soft default, not ${VAR:?err} — same reasoning as
      # OH_AGENT_CANVAS_SECRET_KEY above: a hard-required var here would be
      # interpolated across the whole merged compose model before profile
      # filtering and break `--profile base up` for anyone not using the
      # proxy profile. ./scripts/stax-preflight.sh enforces this instead.
      - OMNIROUTE_PUBLIC_DOMAIN=${OMNIROUTE_PUBLIC_DOMAIN:-CHANGEME.example.com}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-20128}
      # Left unset by default, which the Caddyfile turns into a .localhost
      # name served by Caddy's internal CA — an unreachable site rather than
      # a broken config. Set it only when the workflow profile is running and
      # the DNS record exists; publishing Activepieces relies on it closing
      # its own registration after the first account (verified, see the
      # Caddyfile comment).
      - ACTIVEPIECES_PUBLIC_DOMAIN=${ACTIVEPIECES_PUBLIC_DOMAIN:-}
    volumes:
      # Bind-mounted as a FILE, so the container holds the inode it was
      # started with. Editing this file in place is picked up by
      # `caddy reload`, but anything that REPLACES it — git checkout, git
      # pull, mv — leaves the container reading the old inode and the reload
      # silently applies stale config. Recreate the container after those:
      #   docker compose --profile proxy up -d --force-recreate caddy
      # Cost a real debugging detour on 2026-08-28.
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      omniroute-base:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    profiles:
      - proxy

  # Activepieces' job queue. Local, because a hosted free tier cannot hold it.
  #
  # This profile originally pointed AP_REDIS_HOST at Upstash, on the reasoning
  # that offloading Postgres and Redis made the profile cost one container
  # instead of four. Half of that reasoning was wrong, and it failed in
  # production on 2026-08-29: Upstash's free tier caps total REQUESTS at
  # 500,000 per month — about 11.5 commands a minute — while a BullMQ worker
  # polls its queue continuously whether or not any flow is running. The cap
  # was reached, every flow stopped, and the container went on reporting
  # `healthy` for 14 hours while logging 454,605 identical errors.
  #
  # Neon stays: its free tier limits storage, not requests, and storage is
  # something a workflow engine uses slowly (211 MB of 500 MB after weeks).
  # The distinction is the whole lesson — offload what is billed by size, not
  # what is billed by call.
  #
  # Measured cost of running it here: 4.3 MB of RAM.
  ap-redis:
    image: redis:8.6.5-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # No persistence on purpose. This holds an in-flight job queue, not state:
    # the schedule that matters re-fires every 15 minutes, and durable queue
    # history already lives in Postgres. Persistence would buy disk churn.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    # No published ports: reachable only from inside the compose network.
    # Deliberately NOT named `redis` — omniroute/docker-compose.yml already
    # defines a service by that name, and compose merges by service name, so a
    # bare `redis` here would silently graft onto OmniRoute's rate limiter
    # instead of creating a second instance.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: ${AP_REDIS_MEM_LIMIT:-256m}
    memswap_limit: ${AP_REDIS_MEM_LIMIT:-256m}
    cpus: ${AP_REDIS_CPUS:-0.5}
    logging: *default-logging
    profiles:
      - workflow

  # Code knowledge graph, built here and served to both the laptop and the
  # workflow engine over MCP. See docs/integrations/codegraph.md.
  #
  # Two services, one image, the way agent-sidecar does it — but unlike that
  # pair these two share mutable state with an ordering requirement, so serve
  # deliberately does NOT depend_on build: a `service_completed_successfully`
  # condition would make every `up` wait out a four-minute extraction, and a
  # failed build would leave serve down for good. Refreshes are the timer's
  # job (scripts/codegraph-refresh.sh), not compose's.
  codegraph-build:
    build: ./codegraph
    image: king-codegraph:local
    command:
      - sh
      - -c
      - |
        set -e
        graphify extract /src --out /out --code-only --no-cluster \
          --max-workers ${CODEGRAPH_WORKERS:-2}
        # Staleness is the failure mode that matters for a graph: it answers
        # confidently about code as it was, and CLAUDE.md tells agents to
        # prefer it over grep. Record what it was built from so a checker can
        # compare against the live HEAD.
        printf 'commit=%s\nbuilt_at=%s\n' "$${CODEGRAPH_COMMIT:-unknown}" \
          "$$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /out/graphify-out/BUILD_INFO
        echo "--- BUILD_INFO ---"; cat /out/graphify-out/BUILD_INFO
    environment:
      - CODEGRAPH_COMMIT=${CODEGRAPH_COMMIT:-unknown}
    volumes:
      # Read-only, and deliberately WITHOUT the /dev/null secret masks that
      # openhands uses. Those cannot work here: Docker must create the
      # mountpoint file before it can shadow one, and inside a :ro mount that
      # fails outright — `make mountpoint "/src/observability/.env":
      # read-only file system` — for any .env the host does not happen to
      # have. Tried; it broke the first real build on the VPS.
      #
      # :ro is the stronger half of that trade anyway: the extractor cannot
      # write into the tree at all. For reading, the boundary is .gitignore,
      # which graphify honours by default and which is the right line — a file
      # that is NOT gitignored is already committed, so a graph is not where it
      # leaks. stax-smoke.yml plants a canary in a gitignored .env and asserts
      # it never reaches graph.json, so this is tested, not assumed.
      - ./:/src:ro
      - codegraph-out:/out
    # One-shot: `docker compose run --rm codegraph-build`, never `up`.
    restart: "no"
    security_opt:
      - no-new-privileges:true
    # Measured, not chosen. At 3g the kernel OOM-killed it inside its own
    # cgroup (anon-rss 3.0 GB) and left a graph.json that was never written;
    # at 4g it completes. memswap_limit matches so pressure stays a loud,
    # contained OOM instead of dragging this 7.8 GB host into swap thrash.
    mem_limit: ${CODEGRAPH_BUILD_MEM_LIMIT:-4g}
    memswap_limit: ${CODEGRAPH_BUILD_MEM_LIMIT:-4g}
    cpus: ${CODEGRAPH_BUILD_CPUS:-2.0}
    logging: *default-logging
    profiles:
      - codegraph

  codegraph-serve:
    build: ./codegraph
    image: king-codegraph:local
    command:
      - sh
      - -c
      - |
        set -e
        # A server that starts against a missing graph answers every query
        # with nothing, and an agent reads that as "the code does not exist" —
        # worse than no graph at all. Refuse to start instead.
        if [ ! -s /out/graphify-out/graph.json ]; then
          echo "FATAL: /out/graphify-out/graph.json is missing or empty."
          echo "Run: docker compose --profile codegraph run --rm codegraph-build"
          exit 1
        fi
        exec python -m graphify.serve /out/graphify-out/graph.json \
          --transport http --host 0.0.0.0 --port 8130 --path /mcp --stateless
    environment:
      # graphify reads this itself; passing it as --api-key would put the
      # secret in the container's argv, visible to anything reading /proc.
      - GRAPHIFY_API_KEY=${GRAPHIFY_API_KEY:-}
    volumes:
      - codegraph-out:/out:ro
    ports:
      - "${CODEGRAPH_BIND_HOST:-127.0.0.1}:${CODEGRAPH_PORT:-8130}:8130"
    healthcheck:
      # A real MCP `initialize` with the key, not a port probe: it proves the
      # graph loaded, the transport works, and auth is enforced, all at once.
      # --stateless above keeps these from accumulating sessions.
      test:
        - CMD
        - python
        - -c
        - |
          import json, os, urllib.request
          urllib.request.urlopen(urllib.request.Request(
            "http://localhost:8130/mcp",
            data=json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize",
              "params": {"protocolVersion": "2025-06-18", "capabilities": {},
                         "clientInfo": {"name": "healthcheck", "version": "1"}}}).encode(),
            headers={"Content-Type": "application/json",
                     "Accept": "application/json, text/event-stream",
                     "Authorization": "Bearer " + os.environ["GRAPHIFY_API_KEY"]}), timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # on-failure, not unless-stopped: the guard above exits non-zero when the
    # graph is missing, and `unless-stopped` would turn that into a crashloop
    # writing log lines forever on a host with 20 GB free.
    restart: on-failure:3
    security_opt:
      - no-new-privileges:true
    # Measured with the real 82 MB graph: 392 MB anon, 717 MB including the
    # page cache from reading it. Page cache is reclaimable, so this holds.
    mem_limit: ${CODEGRAPH_SERVE_MEM_LIMIT:-768m}
    memswap_limit: ${CODEGRAPH_SERVE_MEM_LIMIT:-768m}
    cpus: ${CODEGRAPH_SERVE_CPUS:-0.5}
    logging: *default-logging
    profiles:
      - codegraph

  # Local model, for triage-sized work. See docs/integrations/localmodel.md.
  #
  # OmniRoute already knows this provider — omniroute/src/shared/constants/
  # providers/local.ts defines `ollama-local` with passthroughModels and no
  # required API key — so nothing here teaches the gateway anything. It only
  # needs to exist at a URL the gateway can reach.
  #
  # No published ports at all: the gateway reaches it at http://ollama:11434/v1
  # over the compose network. Note that this puts an unauthenticated inference
  # server on the same default bridge as agent-sidecar, which executes
  # model-generated Python. That is a deliberate trade, stated rather than
  # implied: introducing a second network would break the include-based
  # single-project layout every other service depends on.
  ollama:
    image: ollama/ollama:0.33.2
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # -1, reversing the 0 this shipped with for a day. The reasoning behind 0
      # was that RAM is scarcer here than seconds; measurement showed seconds
      # were not the cost either way, and that 0 made the model unusable.
      #
      # With the model RESIDENT, 12 calls through OmniRoute measured a median of
      # 2.1 s and a maximum of 2.2 s. With KEEP_ALIVE=0 the same calls took
      # 11.6-12.5 s warm and 29 s cold, against OmniRoute's 15 s
      # RATE_LIMIT_MAX_WAIT_MS — so every call was one queue hiccup from a 504,
      # and cold ones were impossible rather than merely slow.
      #
      # Note what that also corrects: the 9-second gap between "direct to
      # Ollama" and "through the gateway" was never gateway overhead. It was the
      # model being loaded from disk on each call. The gateway adds almost
      # nothing.
      #
      # Not 5m, which remains the worst of the three: frequent callers pay the
      # RAM anyway, infrequent ones pay the load anyway, and callers spaced near
      # five minutes pay load/unload churn.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:--1}
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      # Default is 512. At ~12 s per request that means the hundredth caller
      # waits twenty minutes instead of being refused immediately — and a
      # workflow that retries on timeout is exactly what fills a queue.
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-2}
      # KV cache grows linearly with context. Unpinned, mem_limit below is not
      # a number anyone chose — it is whatever the caller asks for, clamped by
      # the OOM killer.
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-4096}
      # Read by the healthcheck below. Must match what ollama-pull fetches, or
      # the healthcheck asserts a model that was never pulled.
      # 1.5b, not 3b. The 3b answered in 13 s direct but returned 504 through
      # the gateway twice, and its accuracy on the one task this was built for
      # was no better. 1.5b holds 1.126 GB resident against 3b's 2.1 GB, which
      # is what makes coexistence with the 4 GB codegraph build tolerable.
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b-instruct-q4_K_M}
    healthcheck:
      # Asserts the MODEL, not the port. `ollama serve` answers happily with
      # zero models pulled, and OmniRoute will then save a connection that
      # looks healthy and 404s every request — the exact healthy-but-useless
      # shape this deployment has hit three times.
      test:
        - CMD-SHELL
        # The exact tag. This used to strip everything after the colon, so
        # `qwen2.5:3b-instruct-q4_K_M` became the literal `qwen2.5` and matched
        # ANY qwen2.5 tag — with two pulled on this host, pointing OLLAMA_MODEL
        # at a tag that was never fetched would have produced a healthy
        # container that 404s every request. Exactly the shape the line exists
        # to prevent. Verified against real `ollama list` output, which prints
        # the tag unmodified.
        - ollama list | grep -q "$${OLLAMA_MODEL}" || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Measured: 1.126 GiB resident with qwen2.5:1.5b-instruct-q4_K_M loaded and
    # KEEP_ALIVE=-1. 1536m leaves roughly a third in hand for the KV cache at
    # the pinned 4096 context.
    mem_limit: ${OLLAMA_MEM_LIMIT:-1536m}
    memswap_limit: ${OLLAMA_MEM_LIMIT:-1536m}
    # 1.0, not 1.5. On 2 vCPU, 1.5 leaves 0.5 for the gateway, the workflow
    # engine, Caddy and dockerd together — and OmniRoute's healthcheck times
    # out in 5 seconds.
    cpus: ${OLLAMA_CPUS:-1.0}
    logging: *default-logging
    profiles:
      - localmodel

  # One-shot, run after `up`. Without it Ollama comes up healthy-looking with
  # no model at all, which is failure L1 in the doc.
  ollama-pull:
    image: ollama/ollama:0.33.2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull "$${OLLAMA_MODEL}"
        ollama list
    environment:
      - OLLAMA_HOST=http://ollama:11434
      # MUST match the `ollama` service default above. It did not: this said
      # 3b while the server said 1.5b, and with OLLAMA_MODEL unset in .env a
      # fresh deploy would pull 3b, then fail a healthcheck that greps for
      # 1.5b — forever, having spent 2 GB of a disk that is already 62% full.
      # The running host never showed it because 1.5b was pulled by hand.
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b-instruct-q4_K_M}
    depends_on:
      - ollama
    restart: "no"
    logging: *default-logging
    profiles:
      - localmodel

volumes:
  openhands-canvas-settings:
  caddy-data:
  caddy-config:
  activepieces-cache:
  codegraph-out:
  ollama-models:
  agent-audit:
