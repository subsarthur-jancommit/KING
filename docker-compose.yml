# KING root — thin wrapper so `docker compose up` works from repo root.
# Delegates entirely to the vendored OmniRoute compose file; see omniroute/docker-compose.yml
# for the full profile list (base, web, cli, host, cliproxyapi, memory, bifrost).
# Also includes STAX's own opt-in profiles — see docs/integrations/scalability-system.md.
#
# Deploying to a VPS: run `./scripts/stax-preflight.sh` first. Compose cannot
# gate a required variable per-profile (`${VAR:?err}` is interpolated across
# the whole merged model before profile filtering — verified, see
# docs/integrations/vps-hardening.md), so the placeholder-secret and
# public-binding checks live in that script instead of in this file.
include:
  - path: omniroute/docker-compose.yml
  - path: observability/docker-compose.langfuse.yml

# Docker's default json-file driver has NO size cap, so a chatty container
# fills the disk until the host stops working — a failure that arrives as
# "everything broke at once" rather than as anything pointing at logs. This
# host has 20 GB free. Every service defined below carries this; the vendored
# omniroute/ and observability/ files are left alone under the never-edit rule.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # NOTE: this file deliberately declares NO service that omniroute/ already
  # defines. The Compose spec is explicit that an including file cannot
  # override an included resource, and a partial `omniroute-base:` override
  # here — added to mount a plugins directory and pass two OTel variables —
  # turned every Docker CI job red with
  # `services.omniroute-base conflicts with imported resource`.
  #
  # It went unnoticed because Compose v5.3+ accepts it and the VPS runs v5.5,
  # so it worked in both places a human looked. Anything OmniRoute needs goes
  # in omniroute/.env (the vendored file reads it via `env_file: .env`), not
  # in a redeclaration here.

  # Auth shim between OmniRoute and Langfuse, nothing more.
  #
  # OmniRoute's built-in OTLP exporter is the only tracing path that lives in
  # the gateway core rather than the plugin runtime — which matters, because
  # the plugin runtime does not invoke its hooks in this deployment (the
  # example Langfuse plugin was proven to work standalone and still never
  # fired through the gateway). But that exporter sends exactly one header,
  # `Content-Type: application/json`, and Langfuse requires Basic auth. This
  # container adds the credentials the exporter cannot.
  #
  # Never publish 4318 to the host: anything that reaches it can write traces
  # into your Langfuse project without authenticating.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    environment:
      # Soft defaults, not ${VAR:?err} — the usual reason: a required
      # variable here is interpolated across the whole merged model before
      # profile filtering and would break `--profile base up` for anyone who
      # never asked for tracing. stax-preflight.sh enforces these instead.
      - LANGFUSE_OTLP_ENDPOINT=${LANGFUSE_OTLP_ENDPOINT:-https://cloud.langfuse.com/api/public/otel}
      # "Basic " + base64("pk-lf-...:sk-lf-..."). The collector has no base64
      # function, so this must arrive pre-encoded.
      - LANGFUSE_OTLP_AUTH=${LANGFUSE_OTLP_AUTH:-CHANGEME-basic-base64}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: ${OTEL_COLLECTOR_MEM_LIMIT:-256m}
    cpus: ${OTEL_COLLECTOR_CPUS:-0.5}
    logging: *default-logging
    profiles:
      - tracing

  agent-sidecar:
    build: ./agent-sidecar
    image: king-agent-sidecar:local
    env_file:
      - path: agent-sidecar/.env
        required: false
    environment:
      - OMNIROUTE_BASE_URL=http://omniroute-base:${DASHBOARD_PORT:-20128}
      # smolagents' CodeAgent executes model-generated Python. "local" runs it
      # inside THIS container, guarded only by an AST-level import allowlist —
      # smolagents documents that as not a security boundary. That is fine
      # while every task arrives from an operator on the command line, which
      # is the only way this service is invoked today.
      #
      # Do NOT reach for "docker" as the hardened option: smolagents'
      # DockerExecutor uses docker.from_env(), so from inside this container
      # it needs the host's Docker socket mounted in — root-equivalent host
      # access, handed to the one service that runs model-written code by
      # design. If task text ever starts arriving from outside an operator's
      # shell, move execution off this host instead ("e2b", "modal",
      # "blaxel"), which needs no local daemon.
      # See docs/integrations/vps-hardening.md.
      - AGENT_SIDECAR_EXECUTOR=${AGENT_SIDECAR_EXECUTOR:-local}
    depends_on:
      omniroute-base:
        condition: service_healthy
    # One-shot runner, not a long-lived service: it executes its CMD and
    # exits, so `up -d` must not treat that exit as a crash to restart.
    restart: "no"
    security_opt:
      # Blocks setuid escalation inside the container. Safe here because the
      # image runs a plain Python process as a non-root user and never needs
      # to gain privileges (see agent-sidecar/Dockerfile).
      - no-new-privileges:true
    # A VPS has far less headroom than a CI runner, and this session already
    # hit real OOM behaviour building this same stack. Bound it explicitly.
    mem_limit: ${AGENT_SIDECAR_MEM_LIMIT:-1g}
    cpus: ${AGENT_SIDECAR_CPUS:-1.0}
    logging: *default-logging
    profiles:
      - agent-sidecar

  openhands-agent-canvas:
    # Pinned by digest, not a semver tag: the upstream image has no semver
    # releases (verified against the GHCR registry API — only `latest`,
    # `main`, and sha-/PR-based tags exist). `main`'s digest as of
    # 2026-08-23 — see docs/integrations/openhands-agent-canvas.md for how
    # to refresh this.
    image: ghcr.io/openhands/agent-canvas@sha256:becb2c0cdebb4427304c4476c34b0c9bf9ddd50e7a0abee444c764c2151ab1b3
    ports:
      # Loopback-only by default — the same rule omniroute/docker-compose.yml
      # already applies to its own password-less Redis, and for the same
      # reason its comment gives: a bare "8000:8000" binds 0.0.0.0, which on
      # a VPS publishes this agent control panel on every interface.
      #
      # This is deliberately stricter than OmniRoute's own dashboard binding,
      # because the dashboard authenticates (INITIAL_PASSWORD + JWT) and this
      # container is not known to. Upstream documents no authentication env
      # var for it other than LOCAL_BACKEND_API_KEY, which their docs scope to
      # `--public` mode; absent a documented default-auth guarantee, assume
      # there is none. Reach it over an SSH tunnel
      # (`ssh -L 8000:127.0.0.1:8000 vps`) or put a reverse proxy with TLS and
      # auth in front before ever setting OPENHANDS_CANVAS_BIND_HOST=0.0.0.0.
      - "${OPENHANDS_CANVAS_BIND_HOST:-127.0.0.1}:${OPENHANDS_CANVAS_PORT:-8000}:8000"
    volumes:
      - openhands-canvas-settings:/home/openhands/.openhands
      - ./:/projects/king
      # Secret masking. The whole-repo mount above would otherwise hand every
      # agent run the real contents of these gitignored .env files — OmniRoute's
      # JWT_SECRET, API_KEY_SECRET and INITIAL_PASSWORD, plus every provider
      # credential in them. Bind-mounting /dev/null over each path shadows it
      # inside this container only: reads return empty, `:ro` rejects writes,
      # and the files on the host are untouched and still work for every other
      # service. Deeper mount paths are applied after the parent bind mount,
      # which is what makes this layering work.
      #
      # These paths track the repo layout above them — if you change the
      # project mount, revisit this list.
      - /dev/null:/projects/king/omniroute/.env:ro
      - /dev/null:/projects/king/observability/.env:ro
      - /dev/null:/projects/king/agent-sidecar/.env:ro
      - /dev/null:/projects/king/activepieces/.env:ro
      # Not a .env, and that is exactly why it was missed. Claude Code appends
      # `permissions.allow` entries to this file verbatim, so whole commands —
      # including a live Neon connection string with its password — accumulate
      # in it in plaintext.
      - /dev/null:/projects/king/.claude/settings.local.json:ro
      # Deliberately left unmounted, as a settled decision rather than a
      # cautious default. Uncommenting this lets Agent Canvas spawn per-task
      # sandbox containers (upstream's safer runtime), but a container that
      # can create containers can create a privileged one that mounts the
      # host root filesystem — so the socket is root-equivalent, and no
      # socket proxy fixes that, because the escape IS container creation.
      #
      # Unmounted, agent code instead runs in this container, bounded by the
      # mounts above: worst case is a wrecked container and a dirtied repo
      # working copy, both recoverable. Mounted, worst case is the host, which
      # is not. Now that the port binds to loopback, the dominant threat is
      # the agent misbehaving rather than an external attacker — and that is
      # precisely the case where the bounded failure is the right one to
      # choose. See docs/integrations/vps-hardening.md.
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # CHANGEME: export OH_AGENT_CANVAS_SECRET_KEY (openssl rand -base64 32)
      # before actually using the `openhands` profile — the fallback below
      # is a placeholder, not a secret. Upstream uses this key to encrypt
      # stored LLM API keys and conversation secrets at rest, so leaving the
      # placeholder in place means encrypting them under a value published in
      # this repo's git history.
      #
      # Deliberately a soft default, not a hard-required ${VAR:?err}: that
      # form is interpolated across the whole merged compose model before
      # profiles are filtered, so it would break `--profile base` (plain
      # OmniRoute) for anyone who never asked for this service. Verified
      # directly, twice — it is the same class of bug as the Langfuse
      # redis/env_file issues. `./scripts/stax-preflight.sh` enforces this
      # instead, where the check can actually be scoped to the profile.
      - OH_SECRET_KEY=${OH_AGENT_CANVAS_SECRET_KEY:-CHANGEME-openssl-rand-base64-32}
      # - LOCAL_BACKEND_API_KEY=  # only required if you later run with --public
    depends_on:
      omniroute-base:
        condition: service_healthy
    # A control panel is meant to survive a VPS reboot, unlike agent-sidecar
    # above. Matches what omniroute/docker-compose.yml sets on its own
    # long-lived services.
    restart: unless-stopped
    # Deliberately no `no-new-privileges` here, unlike agent-sidecar: this is
    # a third-party image whose agent runtime may legitimately need to
    # escalate for in-sandbox package installs, and CI only proves it serves
    # HTTP — not that a hardened run stays healthy under real agent work.
    # Untested hardening that breaks at runtime is worse than none.
    mem_limit: ${OPENHANDS_CANVAS_MEM_LIMIT:-2g}
    cpus: ${OPENHANDS_CANVAS_CPUS:-2.0}
    logging: *default-logging
    profiles:
      - openhands

  # The same image and the same runners as agent-sidecar above, served over
  # HTTP so a workflow step can call them. Kept as a separate service rather
  # than a flag on that one because the two have opposite lifecycles: that one
  # is a one-shot process an operator runs and watches exit, this one is a
  # long-lived server. Only one of them needs to exist for a given deployment.
  #
  # Unauthenticated on purpose, and therefore loopback-only and never proxied:
  # it inherits agent-sidecar's threat model, where safety comes from the fact
  # that only things already inside this compose network can invoke it. If it
  # ever needs to be reachable from outside, it needs auth first — and the
  # executor decision in docs/integrations/vps-hardening.md has to be revisited
  # at the same time, because "tasks arrive from an operator's shell" would no
  # longer be true.
  agent-sidecar-http:
    build: ./agent-sidecar
    image: king-agent-sidecar:local
    command:
      - uv
      - run
      - uvicorn
      - agent_sidecar.server:app
      - --host
      - 0.0.0.0
      - --port
      - "8100"
    env_file:
      - path: agent-sidecar/.env
        required: false
    environment:
      - OMNIROUTE_BASE_URL=http://omniroute-base:${DASHBOARD_PORT:-20128}
      - AGENT_SIDECAR_EXECUTOR=${AGENT_SIDECAR_EXECUTOR:-local}
    ports:
      - "${AGENT_SIDECAR_HTTP_BIND_HOST:-127.0.0.1}:${AGENT_SIDECAR_HTTP_PORT:-8100}:8100"
    depends_on:
      omniroute-base:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen('http://localhost:8100/healthz')
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: ${AGENT_SIDECAR_MEM_LIMIT:-1g}
    cpus: ${AGENT_SIDECAR_CPUS:-1.0}
    logging: *default-logging
    profiles:
      - agent-sidecar-http

  activepieces:
    # Pinned to the version upstream's own docker-compose.yml ships, not the
    # newest tag — that pairing is the one they publish as a working set. See
    # docs/integrations/activepieces-workflow.md for how to bump it.
    #
    # Open-core: MIT, except packages/ee/ which carries a separate enterprise
    # licence. Nothing in this profile touches those paths.
    image: ghcr.io/activepieces/activepieces:0.88.3
    ports:
      # Loopback-only, same rule as openhands-agent-canvas below: reach it
      # over an SSH tunnel (`ssh -L 8080:127.0.0.1:8080 vps`) for setup. It
      # does authenticate, but its webhook endpoints are unauthenticated by
      # design, so put it behind the `proxy` profile on its own subdomain
      # before exposing it — not on a bare public port.
      - "${AP_BIND_HOST:-127.0.0.1}:${AP_PORT:-8080}:80"
    env_file:
      # Everything lives here rather than in `environment:` below because
      # AP_REDIS_USE_SSL must be ABSENT to disable TLS — setting it to "false"
      # still makes Activepieces attempt a TLS handshake (upstream issue
      # #4857). A compose `${AP_REDIS_USE_SSL:-}` default would inject an
      # empty value and trip exactly that bug; an env_file simply omits it.
      - path: activepieces/.env
        required: false
    environment:
      # Left unset deliberately: AP_CONTAINER_TYPE defaults to
      # WORKER_AND_APP, so one container runs both roles. Upstream's own
      # compose splits them into app + 5 worker replicas, which is a
      # horizontal-scale layout this VPS has no headroom for and does not
      # need.
      - AP_QUEUE_MODE=${AP_QUEUE_MODE:-REDIS}
    depends_on:
      omniroute-base:
        condition: service_healthy
    restart: unless-stopped
    # Deliberately no `no-new-privileges`, for the same reason it is absent on
    # openhands-agent-canvas: this is a third-party image that installs piece
    # packages with npm at runtime, and nothing here has tested that a
    # hardened run survives that. Untested hardening that breaks at runtime is
    # worse than none.
    mem_limit: ${AP_MEM_LIMIT:-1536m}
    cpus: ${AP_CPUS:-1.0}
    volumes:
      - activepieces-cache:/usr/src/app/cache
    logging: *default-logging
    profiles:
      - workflow

  caddy:
    image: caddy:2-alpine
    ports:
      # Caddy is the one deliberately public entrypoint added by this
      # profile — it terminates TLS and reverse-proxies internally to
      # omniroute-base over the Docker network, so OmniRoute's own
      # published port never needs to be opened on the host firewall.
      # See docs/integrations/reverse-proxy-tls.md.
      - "80:80"
      - "443:443"
    environment:
      # Deliberately a soft default, not ${VAR:?err} — same reasoning as
      # OH_AGENT_CANVAS_SECRET_KEY above: a hard-required var here would be
      # interpolated across the whole merged compose model before profile
      # filtering and break `--profile base up` for anyone not using the
      # proxy profile. ./scripts/stax-preflight.sh enforces this instead.
      - OMNIROUTE_PUBLIC_DOMAIN=${OMNIROUTE_PUBLIC_DOMAIN:-CHANGEME.example.com}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-20128}
      # Left unset by default, which the Caddyfile turns into a .localhost
      # name served by Caddy's internal CA — an unreachable site rather than
      # a broken config. Set it only when the workflow profile is running and
      # the DNS record exists; publishing Activepieces relies on it closing
      # its own registration after the first account (verified, see the
      # Caddyfile comment).
      - ACTIVEPIECES_PUBLIC_DOMAIN=${ACTIVEPIECES_PUBLIC_DOMAIN:-}
    volumes:
      # Bind-mounted as a FILE, so the container holds the inode it was
      # started with. Editing this file in place is picked up by
      # `caddy reload`, but anything that REPLACES it — git checkout, git
      # pull, mv — leaves the container reading the old inode and the reload
      # silently applies stale config. Recreate the container after those:
      #   docker compose --profile proxy up -d --force-recreate caddy
      # Cost a real debugging detour on 2026-08-28.
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      omniroute-base:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    profiles:
      - proxy

volumes:
  openhands-canvas-settings:
  caddy-data:
  caddy-config:
  activepieces-cache:
